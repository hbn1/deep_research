[project]
name = "mult_agents"
version = "0.1.0"
description = "Multi-agent LangGraph pipeline for deep research"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=1.0",
  "langgraph-checkpoint-postgres",
  "langchain>=1.0",
  "langchain-community",
  "langchain-core",
  "langchain-milvus",
  "fastapi>=0.100",
  "uvicorn[standard]",
  "dashscope",
  "pymilvus",
  "psycopg[binary,pool]",
  "redis",
  "python-dotenv",
  "pydantic-settings",
  "typing-extensions",
  "httpx",
  "sse-starlette",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
